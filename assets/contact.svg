<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Get in touch">
<title>Get in touch</title>
<style>
  .sans { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .fade { animation: fade .8s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
  }
</style>

<defs><pattern id="c" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161616" stroke-width="1"/></pattern></defs>
<rect width="1000" height="170" rx="18" fill="#0d0d0d"/>
<rect width="1000" height="170" rx="18" fill="url(#c)"/>
<rect x=".5" y=".5" width="999" height="169" rx="18" fill="none" stroke="#232323"/>
<text x="56" y="76" class="sans" font-size="32" font-weight="800" letter-spacing="-1" fill="#f5f5f5">Tell me what you're <tspan fill="#FF4D00">building.</tspan></text>
<text x="56" y="112" class="sans" font-size="15" fill="#8a8a8a">Open to full-time, contract, and consulting work. I'll get back to you promptly.</text>
<rect x="926" y="56" width="18" height="18" rx="2" fill="#FF4D00"/>
<rect x="898" y="84" width="18" height="18" rx="2" fill="none" stroke="#FF4D00" stroke-opacity=".5"/>
<rect x="870" y="112" width="18" height="18" rx="2" fill="none" stroke="#FF4D00" stroke-opacity=".25"/>

</svg>
