<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" role="img" aria-label="Tell me what you&#x27;re building.">
<title>Tell me what you&#x27;re building.</title>
<style>
  .sans { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .fade { animation: fade .8s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<defs><pattern id="gk" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161616"/></pattern></defs>
<rect width="1000" height="130" rx="18" fill="#0d0d0d"/>
<rect width="1000" height="130" rx="18" fill="url(#gk)"/>
<rect x=".5" y=".5" width="999" height="129" rx="18" fill="none" stroke="#232323"/>
<text x="52" y="64" class="sans" font-size="30" font-weight="800" letter-spacing="-1" fill="#f5f5f5">Tell me what you're <tspan fill="#FF4D00">building.</tspan></text>
<text x="52" y="94" class="sans" font-size="14.5" fill="#8a8a8a">Open to full-time, contract and consulting work.</text>
<rect x="924" y="34" width="18" height="18" rx="2" fill="#FF4D00"/>
<rect x="896" y="62" width="18" height="18" rx="2" fill="none" stroke="#FF4D00" stroke-opacity=".5"/>
<rect x="868" y="90" width="18" height="18" rx="2" fill="none" stroke="#FF4D00" stroke-opacity=".25"/>

</svg>
