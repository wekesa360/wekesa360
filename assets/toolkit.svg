<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Toolkit">
<title>Toolkit</title>
<style>
  .sans { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .fade { animation: fade .8s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
  }
</style>

<g class="fade" style="animation-delay:0.1s">
<rect x="0.5" y=".5" width="231" height="249" rx="14" fill="#141414" stroke="#232323"/>
<rect x="22" y="26" width="10" height="10" rx="2" fill="#FF4D00"/>
<text x="22" y="66" class="sans" font-size="16" font-weight="700" fill="#f5f5f5">Interfaces &amp; apps</text>
<text x="22" y="92.0" class="sans" font-size="13" font-weight="400" fill="#8a8a8a">Interfaces people can actually</text>
<text x="22" y="111.5" class="sans" font-size="13" font-weight="400" fill="#8a8a8a">use, on whatever screen they</text>
<text x="22" y="131.0" class="sans" font-size="13" font-weight="400" fill="#8a8a8a">are holding.</text>
<rect x="22" y="168" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="66" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">React</text><rect x="118" y="168" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="162" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">TypeScript</text><rect x="22" y="200" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="66" y="216" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">Flutter</text>
</g>
<g class="fade" style="animation-delay:0.22s">
<rect x="256.5" y=".5" width="231" height="249" rx="14" fill="#141414" stroke="#232323"/>
<rect x="278" y="26" width="10" height="10" rx="2" fill="#FF4D00"/>
<text x="278" y="66" class="sans" font-size="16" font-weight="700" fill="#f5f5f5">Backends &amp; APIs</text>
<text x="278" y="92.0" class="sans" font-size="13" font-weight="400" fill="#8a8a8a">Clear contracts, boring</text>
<text x="278" y="111.5" class="sans" font-size="13" font-weight="400" fill="#8a8a8a">reliability, and data models</text>
<text x="278" y="131.0" class="sans" font-size="13" font-weight="400" fill="#8a8a8a">that age well.</text>
<rect x="278" y="168" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="322" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">Python</text><rect x="374" y="168" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="418" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">Django</text><rect x="278" y="200" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="322" y="216" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">Node</text><rect x="374" y="200" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="418" y="216" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">Laravel</text>
</g>
<g class="fade" style="animation-delay:0.33999999999999997s">
<rect x="512.5" y=".5" width="231" height="249" rx="14" fill="#141414" stroke="#232323"/>
<rect x="534" y="26" width="10" height="10" rx="2" fill="#FF4D00"/>
<text x="534" y="66" class="sans" font-size="16" font-weight="700" fill="#f5f5f5">Infrastructure</text>
<text x="534" y="92.0" class="sans" font-size="13" font-weight="400" fill="#8a8a8a">Ship often, ship safely, and</text>
<text x="534" y="111.5" class="sans" font-size="13" font-weight="400" fill="#8a8a8a">run close to the people using</text>
<text x="534" y="131.0" class="sans" font-size="13" font-weight="400" fill="#8a8a8a">it.</text>
<rect x="534" y="168" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="578" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">Cloudflare</text><rect x="630" y="168" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="674" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">AWS</text><rect x="534" y="200" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="578" y="216" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">Docker</text><rect x="630" y="200" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="674" y="216" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">CI/CD</text>
</g>
<g class="fade" style="animation-delay:0.45999999999999996s">
<rect x="768.5" y=".5" width="231" height="249" rx="14" fill="#141414" stroke="#232323"/>
<rect x="790" y="26" width="10" height="10" rx="2" fill="#FF4D00"/>
<text x="790" y="66" class="sans" font-size="16" font-weight="700" fill="#f5f5f5">Data, AI &amp; Automation</text>
<text x="790" y="92.0" class="sans" font-size="13" font-weight="400" fill="#8a8a8a">Trustworthy data first, and AI</text>
<text x="790" y="111.5" class="sans" font-size="13" font-weight="400" fill="#8a8a8a">only where it genuinely earns</text>
<text x="790" y="131.0" class="sans" font-size="13" font-weight="400" fill="#8a8a8a">its place.</text>
<rect x="790" y="168" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="834" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">PostgreSQL</text><rect x="886" y="168" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="930" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">PostGIS</text><rect x="790" y="200" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="834" y="216" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">Celery</text><rect x="886" y="200" width="88" height="24" rx="6" fill="#0d0d0d" stroke="#232323"/><text x="930" y="216" text-anchor="middle" class="mono" font-size="11.5" fill="#f5f5f5">LLMs</text>
</g>
</svg>
