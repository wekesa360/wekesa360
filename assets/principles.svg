<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Engineering principles">
<title>Engineering principles</title>
<style>
  .sans { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .fade { animation: fade .8s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
  }
</style>

<g class="fade" style="animation-delay:0.1s">
<rect x="0.5" y="0.5" width="487" height="137" rx="14" fill="#141414" stroke="#232323"/>
<text x="28" y="40" class="mono" font-size="12" fill="#FF4D00">01</text>
<text x="60" y="41" class="sans" font-size="19" font-weight="700" fill="#f5f5f5">Build for the worst day</text>
<text x="28" y="82.0" class="sans" font-size="14" font-weight="400" fill="#8a8a8a">Systems earn trust on their busiest, messiest day: peak</text>
<text x="28" y="103.0" class="sans" font-size="14" font-weight="400" fill="#8a8a8a">traffic, flaky networks, a dependency that goes down.</text>
</g>
<g class="fade" style="animation-delay:0.22s">
<rect x="512.5" y="0.5" width="487" height="137" rx="14" fill="#141414" stroke="#232323"/>
<text x="540" y="40" class="mono" font-size="12" fill="#FF4D00">02</text>
<text x="572" y="41" class="sans" font-size="19" font-weight="700" fill="#f5f5f5">Latency is a feature</text>
<text x="540" y="82.0" class="sans" font-size="14" font-weight="400" fill="#8a8a8a">Users feel every round trip. Moving work closer to them, and</text>
<text x="540" y="103.0" class="sans" font-size="14" font-weight="400" fill="#8a8a8a">letting apps keep working offline, often matters most.</text>
</g>
<g class="fade" style="animation-delay:0.33999999999999997s">
<rect x="0.5" y="162.5" width="487" height="137" rx="14" fill="#141414" stroke="#232323"/>
<text x="28" y="202" class="mono" font-size="12" fill="#FF4D00">03</text>
<text x="60" y="203" class="sans" font-size="19" font-weight="700" fill="#f5f5f5">Trust is built in</text>
<text x="28" y="244.0" class="sans" font-size="14" font-weight="400" fill="#8a8a8a">When the data belongs to real people, security and</text>
<text x="28" y="265.0" class="sans" font-size="14" font-weight="400" fill="#8a8a8a">accountability are requirements from the first line of code.</text>
</g>
<g class="fade" style="animation-delay:0.45999999999999996s">
<rect x="512.5" y="162.5" width="487" height="137" rx="14" fill="#141414" stroke="#232323"/>
<text x="540" y="202" class="mono" font-size="12" fill="#FF4D00">04</text>
<text x="572" y="203" class="sans" font-size="19" font-weight="700" fill="#f5f5f5">Own the outcome</text>
<text x="540" y="244.0" class="sans" font-size="14" font-weight="400" fill="#8a8a8a">Code is only the means. I care whether the people using what I</text>
<text x="540" y="265.0" class="sans" font-size="14" font-weight="400" fill="#8a8a8a">build can actually get their job done better.</text>
</g>
</svg>
