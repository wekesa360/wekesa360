<svg xmlns="http://www.w3.org/2000/svg" width="488" height="270" viewBox="0 0 488 270" role="img" aria-label="CPIMS: Kenya Child Protection">
<title>CPIMS: Kenya Child Protection</title>
<style>
  .sans { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .fade { animation: fade .8s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
  }

      .arrow { animation: nudge 2.4s ease-in-out infinite; }
      @keyframes nudge { 0%,100% { transform: translate(0,0); } 50% { transform: translate(3px,-3px); } }
      .bar { transform-origin: left; transform: scaleX(0); animation: grow 1.2s cubic-bezier(.22,1,.36,1) .2s forwards; }
      @keyframes grow { to { transform: scaleX(1); } }
    </style>

<defs><pattern id="pcpims" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161616" stroke-width="1"/></pattern></defs>
<rect x=".5" y=".5" width="487" height="269" rx="16" fill="#0d0d0d" stroke="#232323"/>
<rect x="1" y="1" width="486" height="268" rx="16" fill="url(#pcpims)" opacity=".6"/>
<rect x="28" y="1" width="64" height="3" fill="#FF4D00" class="bar"/>
<text x="28" y="44" class="mono" font-size="11" letter-spacing="1.5" fill="#FF4D00">PUBLIC SECTOR · MOBILE</text>
<g class="arrow"><text x="460" y="46" text-anchor="end" class="sans" font-size="20" fill="#5c5c5c">↗</text></g>
<text x="28" y="80" class="sans" font-size="21" font-weight="700" letter-spacing="-.3" fill="#f5f5f5">CPIMS: Kenya Child Protection</text>
<text x="28" y="112.0" class="sans" font-size="13.5" font-weight="400" fill="#8a8a8a">Kenya&#x27;s national case management system for child</text>
<text x="28" y="132.9" class="sans" font-size="13.5" font-weight="400" fill="#8a8a8a">protection. Helped launch the Flutter Android client that</text>
<text x="28" y="153.8" class="sans" font-size="13.5" font-weight="400" fill="#8a8a8a">took it to social workers in the field, serving 1,000+</text>
<text x="28" y="174.8" class="sans" font-size="13.5" font-weight="400" fill="#8a8a8a">daily users.</text>
<rect x="28" y="200" width="72" height="24" rx="12" fill="none" stroke="#232323"/><text x="64.0" y="216" text-anchor="middle" class="mono" font-size="12" fill="#8a8a8a">Flutter</text>
<rect x="108" y="200" width="64" height="24" rx="12" fill="none" stroke="#232323"/><text x="140.0" y="216" text-anchor="middle" class="mono" font-size="12" fill="#8a8a8a">Django</text>
<rect x="180" y="200" width="94" height="24" rx="12" fill="none" stroke="#232323"/><text x="227.0" y="216" text-anchor="middle" class="mono" font-size="12" fill="#8a8a8a">PostgreSQL</text>
<text x="28" y="252" class="mono" font-size="11" fill="#5c5c5c">national infrastructure</text>

</svg>
